name: Update transport data

on:
  schedule:
    # GitHub Actions cron runs in UTC. The generator itself evaluates service
    # dates in Europe/Sofia, so DST does not alter the schedule classification.
    - cron: '30 2,5 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate transport data from official CGM GTFS
        run: python Scripts/generate_transport_data.py

      - name: Validate generated schedule and virtual-board data
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/transport-calendar.test.js
          node tests/virtual-board-api.test.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update transport data"
            git push
          fi
