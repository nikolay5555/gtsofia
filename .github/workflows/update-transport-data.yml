name: Update transport data

on:
  schedule:
    # GitHub schedules are delayed occasionally under load. Use a non-round
    # minute and pin the schedule to Sofia time so DST is handled for us.
    - cron: '30 2,5 */1 * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate transport data from official CGM GTFS
        run: python Scripts/generate_transport_data.py

      - name: Validate generator syntax
        run: python -m py_compile Scripts/generate_transport_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f data/transport.json

          git add -A data/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update transport data"
            git push
          fi
