name: Update transport data

on:
  schedule:
    - cron: '11 1 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate transport data from official CGM GTFS
        run: python Scripts/generate_transport_data.py

      - name: Setup Node for frontend regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          for test_file in tests/*.test.js; do
            node "$test_file"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update transport data"
            git push
          fi
