<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("gtsofia.theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const effective = theme === "dark" || (theme !== "light" && systemDark) ? "dark" : "light";
        document.documentElement.dataset.theme = effective;
        document.documentElement.dataset.themePreference =
          theme === "dark" || theme === "light" || theme === "auto" ? theme : "auto";
      } catch {}
    })();
  </script>
  <title>Виртуални табла | GTSofia</title>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-logo">GTSOFIA</a>
    <button class="nav-toggle" onclick="toggleMenu()" aria-label="Отвори меню">☰</button>
    <nav id="navMenu">
      <a href="index.html">Начало</a>
      <a href="schedules.html">Разписания</a>
      <a href="virtual-boards.html" class="active">Виртуални табла</a>
      <a href="rolling-stock.html">Подвижен състав</a>
      <a href="about.html">За проекта</a>
    </nav>
    <div class="theme-switcher">
      <button
        type="button"
        id="themeToggle"
        class="theme-toggle"
        aria-label="Автоматичен режим"
        title="Автоматичен режим"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <span aria-hidden="true">◐</span>
      </button>
      <div id="themeMenu" class="theme-menu" role="radiogroup" aria-label="Тема" hidden>
        <button type="button" data-theme-choice="light" role="radio" aria-checked="false">
          <span aria-hidden="true">☀</span><span>Светъл</span>
        </button>
        <button type="button" data-theme-choice="dark" role="radio" aria-checked="false">
          <span aria-hidden="true">☾</span><span>Тъмен</span>
        </button>
        <button type="button" data-theme-choice="auto" role="radio" aria-checked="false">
          <span aria-hidden="true">◐</span><span>Автоматичен</span>
        </button>
      </div>
    </div>
  </header>

  <main class="virtual-boards">

    <section class="virtual-board-layout">
      <div class="virtual-map-card">
        <div id="virtualMap" class="virtual-map" aria-label="Карта на спирките в София"></div>
      </div>

      <aside class="virtual-board-panel" id="virtualBoardPanel">
        <div id="virtualBoardContent" class="virtual-board-content">
          <div class="virtual-board-controls">
            <div class="virtual-stop-search virtual-stop-search-panel">
              <label class="sr-only" for="stopSearch">Търсене по спирка</label>
              <input
                id="stopSearch"
                type="search"
                placeholder="Търсене по спирка…"
                autocomplete="off"
                aria-label="Търсене по спирка"
              />
              <div id="stopSearchResults" class="virtual-stop-search-results" hidden></div>
            </div>
            <button
              type="button"
              id="locateUserButton"
              class="map-tool-button map-location-button"
              aria-label="Моята локация"
              title="Моята локация"
            >
              <img src="Icons/location.svg" alt="" aria-hidden="true" />
            </button>
          </div>
          <div id="virtualBoardBody" class="virtual-board-body">
            <div class="virtual-board-empty">
              <p>Изберете спирка от картата, за да видите следващите пристигания</p>
            </div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script src="navbar.js"></script>
  <script src="transport-data.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="virtual-boards.js?v=19"></script>
  <script src="theme.js"></script>
</body>
</html>
