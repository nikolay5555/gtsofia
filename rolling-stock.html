<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Подвижен състав | GTSofia</title>

  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

  <a href="index.html" class="nav-logo">GTSOFIA</a>

  <button class="nav-toggle" onclick="toggleMenu()">☰</button>

  <nav id="navMenu">
    <a href="index.html">Начало</a>
    <a href="schedules.html">Разписания</a>
    <a href="virtual-boards.html">Виртуални табла</a>
    <a href="rolling-stock.html" class="active">Подвижен състав</a>
    <a href="about.html">За проекта</a>
  </nav>

  <div class="theme-switcher">
      <button
        type="button"
        id="themeToggle"
        class="theme-toggle"
        aria-label="Автоматичен режим"
        title="Автоматичен режим"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <span aria-hidden="true">◐</span>
      </button>
      <div id="themeMenu" class="theme-menu" role="radiogroup" aria-label="Тема" hidden>
        <button type="button" data-theme-choice="light" role="radio" aria-checked="false">
          <span aria-hidden="true">☀</span><span>Светъл</span>
        </button>
        <button type="button" data-theme-choice="dark" role="radio" aria-checked="false">
          <span aria-hidden="true">☾</span><span>Тъмен</span>
        </button>
        <button type="button" data-theme-choice="auto" role="radio" aria-checked="false">
          <span aria-hidden="true">◐</span><span>Автоматичен</span>
        </button>
      </div>
    </div>

</header>

<!-- PAGE -->
<main class="content">

  <h1 style="margin-bottom: 20px;">Подвижен състав</h1>

<div class="stock-filters">

  <button onclick="scrollToStock('bus')">
    Автобуси
  </button>

  <button onclick="scrollToStock('trolley')">
    Тролейбуси
  </button>

  <button onclick="scrollToStock('tram')">
    Трамваи
  </button>

  <button onclick="scrollToStock('metro')">
    Метро
  </button>

</div>

<div class="stock-grid" id="stockGrid"></div>

</main>

<!-- SCRIPTS -->
<script src="rolling-stock.js"></script>
<script src="navbar.js"></script>

  <script src="theme.js"></script>
</body>
</html>
