<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (() => {
      try {
        const theme = localStorage.getItem("gtsofia.theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const effective = theme === "dark" || (theme !== "light" && systemDark) ? "dark" : "light";
        document.documentElement.dataset.theme = effective;
        document.documentElement.dataset.themePreference =
          theme === "dark" || theme === "light" || theme === "auto" ? theme : "auto";
      } catch {}
    })();
  </script>
  <title>Разписания | GTSofia</title>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-logo">GTSOFIA</a>
    <button class="nav-toggle" onclick="toggleMenu()">☰</button>
    <nav id="navMenu">
      <a href="index.html">Начало</a>
      <a href="schedules.html" class="active">Разписания</a>
      <a href="virtual-boards.html">Виртуални табла</a>
      <a href="rolling-stock.html">Подвижен състав</a>
      <a href="about.html">За проекта</a>
    </nav>
    <div class="theme-switcher">
      <button
        type="button"
        id="themeToggle"
        class="theme-toggle"
        aria-label="Автоматичен режим"
        title="Автоматичен режим"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <span aria-hidden="true">◐</span>
      </button>
      <div id="themeMenu" class="theme-menu" role="radiogroup" aria-label="Тема" hidden>
        <button type="button" data-theme-choice="light" role="radio" aria-checked="false">
          <span aria-hidden="true">☀</span><span>Светъл</span>
        </button>
        <button type="button" data-theme-choice="dark" role="radio" aria-checked="false">
          <span aria-hidden="true">☾</span><span>Тъмен</span>
        </button>
        <button type="button" data-theme-choice="auto" role="radio" aria-checked="false">
          <span aria-hidden="true">◐</span><span>Автоматичен</span>
        </button>
      </div>
    </div>
  </header>

  <main class="schedule-page">
    <section class="schedule-card schedule-controls-card">
      <div class="schedule-controls">
        <div class="schedule-control">
          <label for="lineDropdownButton">Линия</label>
          <div class="schedule-dropdown" id="lineDropdown">
            <button id="lineDropdownButton" class="schedule-select-button" type="button" aria-expanded="false">
              <span class="schedule-placeholder">Изберете линия…</span>
              <span class="schedule-chevron">⌄</span>
            </button>
            <div id="lineDropdownMenu" class="schedule-dropdown-menu" hidden></div>
          </div>
        </div>

        <div class="schedule-control">
          <label for="directionSelect">Направление / дестинация</label>
          <select id="directionSelect" class="schedule-native-select" disabled>
            <option value="">Първо изберете линия…</option>
          </select>
        </div>

        <div class="schedule-control">
          <label for="stopSelect">Спирка</label>
          <select id="stopSelect" class="schedule-native-select" disabled>
            <option value="">Първо изберете направление…</option>
          </select>
        </div>
      </div>

      <div class="schedule-day-tabs" role="tablist" aria-label="Тип ден">
        <button class="schedule-day-tab active" data-day-type="weekday" type="button">Делник</button>
        <button class="schedule-day-tab" data-day-type="weekend" type="button">Празник</button>
      </div>
    </section>

    <section id="scheduleSummary" class="schedule-summary" hidden></section>

    <section id="timetableSection" class="schedule-card timetable-card" hidden>
      <div class="schedule-section-heading">
        <h2>Пълно разписание</h2>
      </div>
      <div id="timetableContainer" class="timetable-scroll"></div>
    </section>

    <section id="courseSection" class="schedule-card course-card" hidden>
      <div class="schedule-section-heading course-heading">
        <h2>Разписание на курса</h2>
        <button id="closeCourseButton" class="schedule-close-button" type="button">Затвори</button>
      </div>
      <div id="courseStops" class="course-stops"></div>
    </section>

    <div id="scheduleEmpty" class="schedule-empty">
      Изберете линия, направление и спирка, за да видите разписанието.
    </div>
  </main>

  <script src="navbar.js"></script>
  <script src="transport-data.js"></script>
  <script src="schedules.js"></script>
  <script src="theme.js"></script>
</body>
</html>
