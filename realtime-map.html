<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта в реално време | GTSofia</title>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-logo">GTSOFIA</a>
    <button class="nav-toggle" onclick="toggleMenu()" aria-label="Отвори меню">☰</button>
    <nav id="navMenu">
      <a href="index.html">Начало</a>
      <a href="schedules.html">Разписания</a>
      <a href="virtual-boards.html">Виртуални табла</a>
      <a href="realtime-map.html" class="active">Карта в реално време</a>
      <a href="rolling-stock.html">Подвижен състав</a>
      <a href="about.html">За проекта</a>
    </nav>
  </header>

  <main class="realtime-map-page">
    <section class="realtime-map-toolbar">
      <div class="realtime-map-title">
        <div class="realtime-map-title-top">
          <span class="live-indicator" aria-hidden="true"></span>
          <span>GTSofia · Realtime</span>
        </div>
        <h1>Карта на превозните средства</h1>
        <p id="realtimeMapStatus">Зареждане на позициите…</p>
      </div>

      <div class="realtime-map-actions">
        <div class="realtime-map-count" id="realtimeVehicleCount">—</div>
        <button type="button" class="map-tool-button" id="realtimeMapLocate" aria-label="Моята локация" title="Моята локация">
          <img src="Icons/location.svg" alt="" aria-hidden="true" />
        </button>
        <button type="button" class="map-tool-button realtime-refresh-button" id="realtimeMapRefresh" aria-label="Обнови картата" title="Обнови картата">
          <span aria-hidden="true">↻</span>
        </button>
      </div>
    </section>

    <section class="realtime-map-layout">
      <div class="realtime-map-card">
        <div id="realtimeMap" class="realtime-map" aria-label="Карта на превозните средства в реално време"></div>

        <div class="realtime-map-overlay">
          <div class="realtime-filter-card">
            <div class="realtime-filter-heading">
              <strong>Покажи</strong>
              <span id="realtimeFilterCount">Всички линии</span>
            </div>

            <div class="realtime-mode-filters" role="group" aria-label="Филтър по вид транспорт">
              <button type="button" class="realtime-mode-filter active" data-type="all">Всички</button>
              <button type="button" class="realtime-mode-filter" data-type="bus">Автобуси</button>
              <button type="button" class="realtime-mode-filter" data-type="tram">Трамваи</button>
              <button type="button" class="realtime-mode-filter" data-type="trolleybus">Тролеи</button>
              <button type="button" class="realtime-mode-filter" data-type="metro">Метро</button>
              <button type="button" class="realtime-mode-filter" data-type="night">Нощни</button>
            </div>

            <label class="realtime-route-search">
              <span class="sr-only">Търсене по линия</span>
              <input id="realtimeRouteSearch" type="search" placeholder="Търси линия…" autocomplete="off" />
            </label>
          </div>

          <div class="realtime-map-legend">
            <span><i class="realtime-legend-dot"></i> актуални позиции</span>
            <span>обновяване на 15 сек.</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="navbar.js"></script>
  <script src="transport-data.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="realtime-map.js?v=1"></script>
</body>
</html>
