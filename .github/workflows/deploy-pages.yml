name: Deploy GitHub Pages

on:
  # Deploy ordinary commits to main.
  push:
    branches:
      - main

  # Crucial for Update transport data: a GITHUB_TOKEN push does not create
  # another push-triggered workflow, but workflow_run is emitted when the
  # producing workflow finishes.
  workflow_run:
    workflows:
      - Update transport data
    types:
      - completed

  # Allow manual deployments from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Validate transport datasets
        run: python Scripts/validate_transport_data.py

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.js

      - name: Check JavaScript syntax
        run: |
          node --check virtual-boards.js
          node --check virtual-board-utils.js
          node --check transport-data.js
          node --check schedules.js
          node --check rolling-stock.js
          node --check navbar.js
          node --check service-worker.js
          node --check api/virtual-board.js
          node --check api/gtfs-realtime.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
