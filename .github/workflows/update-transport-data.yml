name: Update transport data

on:
  schedule:
    - cron: '11 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Generate transport data from official CGM GTFS
        run: python Scripts/generate_transport_data.py

      - name: Validate generated datasets and hashes
        run: python Scripts/validate_transport_data.py

      - name: Run Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run JavaScript regression tests
        run: node --test tests/*.test.js

      - name: Check JavaScript syntax
        run: |
          node --check virtual-boards.js
          node --check transport-data.js
          node --check virtual-board-utils.js
          node --check schedules.js
          node --check rolling-stock.js
          node --check navbar.js
          node --check service-worker.js
          node --check api/virtual-board.js
          node --check api/gtfs-realtime.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update transport data"
            git push
          fi
